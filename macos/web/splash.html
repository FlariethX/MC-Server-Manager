<!DOCTYPE html>

        <rect x="3" y="4" width="18" height="6" rx="1.5"></rect>

        <circle cx="7" cy="17" r="1"></circle>

  <div class="splash-title">MC Server Manager</div>

  <div class="splash-progress-track">

  <div class="splash-author">Автор: <span>FlariethX</span></div>
